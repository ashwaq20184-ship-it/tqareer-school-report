<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>قراءة كلمات الفونيكس</title>
<style>
[data-group="1"]{--group-ink:#235d62;--group-tint:#e8f3ef;--group-border:#b9d8d1}
[data-group="2"]{--group-ink:#205784;--group-tint:#e8f3fb;--group-border:#bfd8eb}
[data-group="3"]{--group-ink:#654482;--group-tint:#f3ecf8;--group-border:#dac9e8}
[data-group="4"]{--group-ink:#8d461b;--group-tint:#fff0e1;--group-border:#edd0b2}
[data-group="5"]{--group-ink:#376331;--group-tint:#edf5e7;--group-border:#c9dfbf}
[data-group="6"]{--group-ink:#8a3e61;--group-tint:#f9eaf0;--group-border:#ecc9d9}
[data-group="7"]{--group-ink:#3f4c89;--group-tint:#eceffc;--group-border:#ccd3ef}

:root{--ink:#172e3a;--paper:#f7faf8}*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Tahoma,Arial,sans-serif}
main{width:min(820px,100% - 28px);margin:22px auto}
header{margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.9rem}.group-label{border:1px solid var(--group-border);border-radius:7px;padding:2px 8px;background:var(--group-tint);color:var(--group-ink)}
h1{color:var(--group-ink);font-size:clamp(1.65rem,5vw,2.3rem);margin:8px 0 2px}
p{margin:3px 0 13px}.back{color:var(--group-ink)}
.picker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:14px}
.sound{min-height:48px;border:1px solid var(--group-border);border-radius:8px;background:var(--group-tint);color:var(--group-ink);font:700 1.22rem Arial,sans-serif;cursor:pointer;padding:3px 0}
.sound small{display:block;font-size:.66rem;line-height:1.1;margin-top:2px;font-weight:500}
.sound[aria-pressed="true"]{background:var(--group-ink);color:white;border-color:var(--group-ink)}
.sound:focus-visible,a:focus-visible{outline:3px solid #a45c19;outline-offset:2px}
.card{border:1px solid var(--group-border);border-radius:14px;background:white;padding:12px clamp(10px,3vw,20px)}
h2{margin:0;font-size:1.15rem;color:var(--group-ink)}
.spelling{display:grid;grid-template-columns:62px minmax(0,1fr);gap:9px;padding:8px 0;align-items:start;border-bottom:1px solid var(--group-border)}
.spelling:last-child{border-bottom:0}.spelling h3{margin:0;color:var(--group-ink);font:700 1rem/1.6 Arial,sans-serif;text-align:center;background:var(--group-tint);border-radius:5px;padding:4px 2px}
.words{display:flex;flex-wrap:wrap;gap:5px 8px;margin:0;padding:0;list-style:none}
.words li{font:500 clamp(1.15rem,4vw,1.55rem)/1.45 Arial,sans-serif;padding:2px 7px;border:1px solid var(--group-border);border-radius:5px}
mark{color:var(--group-ink);background:var(--group-tint);font-weight:700}
footer{margin-top:12px;color:#405765;font-size:.8rem}
@media(max-width:390px){.spelling{grid-template-columns:42px minmax(0,1fr);gap:5px}.words{gap:4px}.words li{padding-inline:5px}}
</style>
</head>
<body><main>
<header><div class="top"><a class="back" id="back" href="./">العودة إلى أصوات المجموعة</a><span class="group-label" id="group"></span></div>
<h1>اقرئي كلمات الفونيكس</h1><p>اختاري الصوت واقرئي الكلمات العشر بصوتك. الحروف الملوّنة تبيّن طريقة كتابة الصوت.</p></header>
<div class="picker" id="picker" dir="ltr" role="group" aria-label="اختيار الصوت"></div>
<section class="card" aria-labelledby="sound-title"><h2 id="sound-title"></h2><div id="words"></div></section>
<footer>متوسطة جميلة بنت عمر بن الخطاب بينبع البحر · إعداد المعلمة أشواق محمد الحربي</footer>
</main>
<script>
const wordSets = [{"label":"s","spellings":[["s",["[s]un","[s]it","[s]ock","[s]and"]],["ss",["mi[ss]","cla[ss]","gla[ss]"]],["c",["[c]ity","[c]ent","[c]ell"]]]},{"label":"a","spellings":[["a",["[a]nt","[a]pple","c[a]t","m[a]p","b[a]g","h[a]t","j[a]m","f[a]n","l[a]mp","st[a]mp"]]]},{"label":"t","spellings":[["t",["[t]op","[t]ap","[t]en","ne[t]","si[t]"]],["tt",["a[tt]ack","a[tt]end"]],["ed",["jump[ed]","wash[ed]","pack[ed]"]]]},{"label":"i","spellings":[["i",["[i]nk","[i]t","p[i]n","s[i]t","f[i]sh","m[i]lk","sh[i]p"]],["y",["g[y]m","m[y]th"]],["ui",["b[ui]ld"]]]},{"label":"p","spellings":[["p",["[p]en","[p]an","[p]ig","[p]ot","ma[p]","ta[p]","cu[p]"]],["pp",["a[pp]le","ha[pp]y","hi[pp]o"]]]},{"label":"n","spellings":[["n",["[n]et","[n]est","[n]ose","pe[n]","su[n]"]],["nn",["fu[nn]y","di[nn]er"]],["kn",["[kn]ee","[kn]ot"]],["gn",["[gn]ome"]]]},{"label":"c/k","spellings":[["c",["[c]at","[c]up","[c]ap","[c]ot"]],["k",["[k]it","[k]id","[k]iss"]],["ck",["ba[ck]","pi[ck]","du[ck]"]]]},{"label":"e","spellings":[["e",["[e]gg","r[e]d","b[e]d","p[e]n","n[e]t","t[e]n"]],["ea",["h[ea]d","br[ea]d","d[ea]f"]],["ai",["s[ai]d"]]]},{"label":"h","spellings":[["h",["[h]at","[h]en","[h]op","[h]ill","[h]and","[h]ot","[h]ome","[h]elp"]],["wh",["[wh]o","[wh]ole"]]]},{"label":"r","spellings":[["r",["[r]ed","[r]un","[r]ain","[r]ing","f[r]og"]],["rr",["ca[rr]ot","pa[rr]ot"]],["wr",["[wr]ap","[wr]ist","[wr]ite"]]]},{"label":"m","spellings":[["m",["[m]at","[m]an","[m]ap","[m]ilk","[m]oon","ja[m]"]],["mm",["su[mm]er","dru[mm]er"]],["mb",["la[mb]","thu[mb]"]]]},{"label":"d","spellings":[["d",["[d]og","[d]ay","[d]ot","be[d]","re[d]"]],["dd",["a[dd]","o[dd]"]],["ed",["play[ed]","call[ed]","clean[ed]"]]]},{"label":"g","spellings":[["g",["[g]o","[g]um","[g]ap","ba[g]","fro[g]"]],["gg",["e[gg]","di[gg]er"]],["gu",["[gu]ess","[gu]ide"]],["gh",["[gh]ost"]]]},{"label":"o","spellings":[["o",["[o]n","[o]ctopus","h[o]t","p[o]t","d[o]t","r[o]ck","s[o]ck","l[o]g"]],["a",["f[a]ther","[a]h"]]]},{"label":"u","spellings":[["u",["[u]p","c[u]p","s[u]n","r[u]n","l[u]nch","b[u]s"]],["o",["s[o]n","m[o]ney"]],["ou",["y[ou]ng","t[ou]ch"]]]},{"label":"l","spellings":[["l",["[l]eg","[l]ip","[l]og","[l]amp","[l]unch","mi[l]k"]],["ll",["be[ll]","hi[ll]","we[ll]","fi[ll]"]]]},{"label":"f","spellings":[["f",["[f]an","[f]ish","[f]rog","[f]it"]],["ff",["pu[ff]","o[ff]"]],["ph",["[ph]one","[ph]oto"]],["gh",["lau[gh]","enou[gh]"]]]},{"label":"b","spellings":[["b",["[b]at","[b]ag","[b]ed","[b]us","[b]ug","[b]ox","ca[b]"]],["bb",["ra[bb]it","ru[bb]er","bu[bb]le"]]]},{"label":"ai","spellings":[["ai",["r[ai]n","tr[ai]n","p[ai]nt"]],["ay",["d[ay]","pl[ay]"]],["a–e",["c[a]k[e]","g[a]m[e]","n[a]m[e]"]],["eigh",["[eigh]t"]],["ey",["th[ey]"]]]},{"label":"j","spellings":[["j",["[j]am","[j]et","[j]ump","[j]ob"]],["g",["[g]em","[g]iant"]],["ge",["ca[ge]","pa[ge]"]],["dge",["bri[dge]","fu[dge]"]]]},{"label":"oa","spellings":[["oa",["g[oa]t","b[oa]t","r[oa]d"]],["ow",["sn[ow]","gr[ow]"]],["o–e",["h[o]m[e]","r[o]p[e]","n[o]s[e]"]],["oe",["t[oe]"]],["o",["g[o]"]]]},{"label":"ie","spellings":[["ie",["t[ie]","p[ie]"]],["i–e",["k[i]t[e]","b[i]k[e]"]],["igh",["l[igh]t","n[igh]t"]],["y",["m[y]","fl[y]"]],["i",["p[i]lot","t[i]ger"]]]},{"label":"ee","spellings":[["ee",["b[ee]","tr[ee]","f[ee]t"]],["ea",["s[ea]","t[ea]","l[ea]f"]],["e–e",["th[e]s[e]","th[e]m[e]"]],["ie",["f[ie]ld"]],["y",["happ[y]"]]]},{"label":"or","spellings":[["or",["f[or]k","st[or]m","c[or]n"]],["ore",["m[ore]","st[ore]","sh[ore]"]],["oar",["b[oar]d","r[oar]"]],["our",["f[our]","p[our]"]]]},{"label":"z","spellings":[["z",["[z]oo","[z]ip","[z]ebra"]],["zz",["bu[zz]","fu[zz]","fi[zz]"]],["s",["i[s]","hi[s]","no[s]e","ro[s]e"]]]},{"label":"w","spellings":[["w",["[w]ind","[w]et","[w]eb","[w]in","[w]all","[w]ig"]],["wh",["[wh]en","[wh]at","[wh]ale","[wh]eel"]]]},{"label":"ng","spellings":[["ng",["si[ng]","ri[ng]","wi[ng]","lo[ng]","so[ng]","stro[ng]"]],["n",["ba[n]k","pi[n]k","thi[n]k","ta[n]k"]]]},{"label":"v","spellings":[["v",["[v]an","[v]et","[v]est","[v]ine","[v]ote","e[v]en"]],["ve",["lo[ve]","gi[ve]","fi[ve]","wa[ve]"]]]},{"label":"oo /ʊ/","spellings":[["oo",["b[oo]k","l[oo]k","c[oo]k","f[oo]t","g[oo]d"]],["u",["p[u]t","p[u]sh","f[u]ll"]],["ou",["c[ou]ld","w[ou]ld"]]]},{"label":"oo /uː/","spellings":[["oo",["m[oo]n","f[oo]d","b[oo]t"]],["ue",["bl[ue]","tr[ue]"]],["ew",["gr[ew]","bl[ew]"]],["u–e",["fl[u]t[e]","r[u]d[e]"]],["ui",["fr[ui]t"]]]},{"label":"y","spellings":[["y",["[y]es","[y]et","[y]ell","[y]ard","[y]arn","[y]awn","[y]oung","[y]ear","[y]olk","[y]ogurt"]]]},{"label":"x","spellings":[["x",["fo[x]","bo[x]","si[x]","mi[x]","fi[x]","wa[x]"]],["cks",["du[cks]","so[cks]"]],["ks",["boo[ks]","loo[ks]"]]]},{"label":"ch","spellings":[["ch",["[ch]in","[ch]ip","[ch]op","[ch]at","[ch]ess","lun[ch]"]],["tch",["ca[tch]","ma[tch]","wa[tch]","fe[tch]"]]]},{"label":"sh","spellings":[["sh",["[sh]ip","[sh]op","fi[sh]","hu[sh]"]],["ch",["[ch]ef","ma[ch]ine"]],["ti",["na[ti]on","mo[ti]on"]],["ci",["spe[ci]al"]],["ssi",["mi[ssi]on"]]]},{"label":"th /ð/","spellings":[["th",["[th]is","[th]at","[th]ese","[th]ose","[th]em","[th]en","[th]ey","mo[th]er","bro[th]er","wea[th]er"]]]},{"label":"th /θ/","spellings":[["th",["[th]in","[th]ree","[th]ink","[th]ank","[th]ick","ba[th]","pa[th]","tee[th]","too[th]","mo[th]"]]]},{"label":"qu","spellings":[["qu",["[qu]ack","[qu]ick","[qu]iz","[qu]een","[qu]iet","[qu]ilt","[qu]it","[qu]ote","[qu]ite","[qu]ill"]]]},{"label":"ou","spellings":[["ou",["[ou]t","l[ou]d","cl[ou]d","s[ou]th","m[ou]th"]],["ow",["c[ow]","n[ow]","h[ow]","t[ow]n","br[ow]n"]]]},{"label":"oi","spellings":[["oi",["[oi]l","c[oi]n","b[oi]l","s[oi]l","p[oi]nt"]],["oy",["b[oy]","t[oy]","j[oy]","enj[oy]","r[oy]al"]]]},{"label":"ue","spellings":[["ue",["c[ue]","resc[ue]","arg[ue]"]],["u–e",["c[u]t[e]","c[u]b[e]","m[u]l[e]"]],["ew",["f[ew]","p[ew]"]],["iew",["v[iew]"]],["u",["[u]nit"]]]},{"label":"er","spellings":[["er",["h[er]","t[er]m","f[er]n","mix[er]"]],["ir",["b[ir]d","g[ir]l","sh[ir]t"]],["ur",["t[ur]n","b[ur]n","c[ur]l"]]]},{"label":"ar","spellings":[["ar",["[ar]m","c[ar]","f[ar]","st[ar]","p[ar]k","d[ar]k","b[ar]n","f[ar]m","sh[ar]p"]],["ear",["h[ear]t"]]]}];
const query = new URLSearchParams(location.search);
const digits = '١٢٣٤٥٦٧';
const requestedGroup = Number(query.get('group'));
const group = Number.isInteger(requestedGroup) && requestedGroup >= 1 && requestedGroup <= 7 ? requestedGroup : 1;
const sounds = wordSets.slice((group - 1) * 6, group * 6);
const examples = {'oo /ʊ/':'book','oo /uː/':'moon','th /ð/':'this','th /θ/':'three'};
document.body.dataset.group = group;
document.querySelector('#group').textContent = 'المجموعة ' + digits[group - 1];
document.querySelector('#back').href = './?group=' + group;
const picker = document.querySelector('#picker');
const title = document.querySelector('#sound-title');
const list = document.querySelector('#words');
const buttons = sounds.map(({label},index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'sound';
  button.textContent = label.split(' ')[0];
  if (examples[label]) {
    const sample = document.createElement('small');
    sample.textContent = examples[label];
    button.append(sample);
    button.setAttribute('aria-label', label + ' ' + examples[label]);
  }
  button.addEventListener('click', () => showSound(index));
  picker.append(button);
  return button;
});
function showSound(index) {
  const {label, spellings} = sounds[index];
  buttons.forEach((button,i) => button.setAttribute('aria-pressed',String(i === index)));
  const soundName = document.createElement('bdi');
  soundName.dir = 'ltr';
  soundName.textContent = examples[label] ? label + ' · ' + examples[label] : label;
  title.replaceChildren('كلمات الصوت ',soundName);
  list.replaceChildren(...spellings.map(([spelling, words]) => {
    const row = document.createElement('div');
    row.className = 'spelling';
    const heading = document.createElement('h3');
    heading.dir = 'ltr';
    heading.textContent = spelling;
    const cards = document.createElement('ul');
    cards.dir = 'ltr';
    cards.className = 'words';
    for (const word of words) {
      const card = document.createElement('li');
      word.split(/\[([^\]]+)\]/).forEach((part,i) => {
        if (i % 2 === 0) card.append(part);
        else {
          const mark = document.createElement('mark');
          mark.textContent = part;
          card.append(mark);
        }
      });
      cards.append(card);
    }
    row.append(heading,cards);
    return row;
  }));
}
const requestedSound = Number(query.get('sound'));
showSound(Number.isInteger(requestedSound) && requestedSound >= 1 && requestedSound <= 6 ? requestedSound - 1 : 0);
</script>
</body></html>
