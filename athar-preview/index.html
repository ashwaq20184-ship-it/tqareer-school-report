function chunkArticle(body,max=900){
  const words=String(body||'').split(/\s+/).filter(Boolean), chunks=[];
  let text='';
  for(const word of words){if(text.length+word.length+1>max&&text){chunks.push(text);text=''}text+=(text?' ':'')+word;}
  if(text)chunks.push(text);
  return chunks.length?chunks:[''];
}
function pageList(issue){
  const arr=[{type:'cover',title:'الغلاف'},{type:'toc',title:'الفهرس'}];let pending=[];let pendingChars=0;
  const flush=()=>{if(pending.length){arr.push({type:'news',articles:pending,title:'من أخبار المدرسة'});pending=[];pendingChars=0}};
  for(const a of issue.articles||[]){
    if(a.importance==='short'){
      const sz=String(a.body||'').length;
      if(pending.length>=3 || (pending.length&&pendingChars+sz>900))flush();
      pending.push(a);pendingChars+=sz;if(pending.length>=3)flush();
    }else{
      flush();const pieces=chunkArticle(a.body,a.importance==='featured'?850:1050);
      pieces.forEach((chunk,idx)=>arr.push({type:a.category==='عدسة جميلة'?'gallery':a.importance==='featured'?'feature':'article',title:idx?`${a.title} — تابع`:a.title,articles:[{...a,body:chunk,summary:idx?'':a.summary,images:idx?[]:a.images,_lastChunk:idx===pieces.length-1}]}));
    }
  }
  flush();arr.push({type:'back',title:'الغلاف الخلفي'});return arr;
}

function articleHtml(a,issue,compact=false){return `<article class="page-article"><span class="eyebrow">${esc(a.category)}</span><h3>${esc(a.title)}</h3>${a.summary?`<p class="page-deck">${esc(a.summary)}</p>`:''}${compact&&a.images?.length?`<img class="news-thumb" src="${esc(safeUrl(a.images[0]))}" alt="صورة مصاحبة للخبر" loading="lazy">`:''}${!compact&&a.images?.length?`<div class="image-gallery ${a.images.length===1?'single':''}">${a.images.map(img=>`<img src="${esc(safeUrl(img))}" alt="صورة مرفقة بالموضوع" data-action="lightbox" data-src="${esc(safeUrl(img))}">`).join('')}</div>`:''}<div class="page-content">${esc(a.body||'')}</div><p class="page-smallprint" style="margin-top:7px">${esc(a.author||'هيئة التحرير')}</p>${a._lastChunk===false?"":articleActions(a,issue)}</article>`}
function readerPage(issue,pages,idx){const page=pages[idx],pg=(n)=>n.toLocaleString('ar-SA');if(page.type==='cover')return `<div class="reader-cover">${coverHTML(issue)}</div>`;if(page.type==='back')return `<div class="page-inner" style="align-items:center;justify-content:center;text-align:center"><img src=${ATHAR_MEDIA.m2} style="width:145px;height:150px;object-fit:contain" alt="شعار المدرسة"><h1 style="font-size:4rem;color:var(--plum)">أثَر</h1><p class="page-deck">لكل إنجاز أثر</p><div style="height:1px;width:170px;background:#d8b6ce;margin:30px 0"></div><h3>متوسطة جميلة بنت عمر بن الخطاب بينبع البحر</h3><p>مجلة مدرسية إلكترونية</p><p class="small">${esc(issueLabel(issue))} · ${fmtDate(issue.published_at)}</p><div class="page-footer" style="width:100%"><span>نهاية العدد</span><span>${pg(idx+1)}</span></div></div>`;if(page.type==='toc')return `<div class="page-inner"><div class="page-kicker"><span>أثَر · ${esc(issueLabel(issue))}</span><span>${pg(idx+1)}</span></div><span class="eyebrow">دَلِيلُ القَارِئَة</span><h2 class="page-title">فهرس العدد</h2><p class="page-deck">انتقلي مباشرة إلى الموضوع الذي تريدين قراءته.</p>${pages.map((p,i)=>i>1&&p.type!=='back'?`<button class="toc-item" data-action="goto-page" data-index="${i}"><span>${esc(p.title)}</span><b>${pg(i+1)}</b></button>`:'').join('')}<div class="page-footer"><span>مجلة أثَر</span><span>${pg(idx+1)}</span></div></div>`;return `<div class="page-inner"><div class="page-kicker"><span>أثَر · ${esc(issueLabel(issue))}</span><span>${pg(idx+1)}</span></div>${page.type==='news'?`<span class="eyebrow">حَصَادُ العَدَد</span><h2 class="page-title">أخبار تستحق أن تُروى</h2>`:''}${page.articles.map(a=>articleHtml(a,issue,page.type==='news')).join('')}<div class="page-footer"><span>متوسطة جميلة بنت عمر بن الخطاب</span><span>${pg(idx+1)}</span></div></div>`}
const readerWide=()=>Number(window.innerWidth||0)>=1100;
function readerView(){

function dialogView(){if(!dialog)return '';if(dialog.type==='comment'){let i=issueById(dialog.issueId),a=i?.articles.find(x=>x.id===dialog.articleId),list=state.comments.filter(c=>c.issue_id===dialog.issueId&&c.article_id===dialog.articleId&&c.status==='approved');return `<div class="floating-dialog" role="dialog" aria-modal="true"><div class="dialog-box"><div class="dialog-top"><h3>التعليقات · ${esc(a?.title||'الموضوع')}</h3><button class="icon-btn" data-action="close-dialog">✕</button></div>${list.length?list.map(c=>`<div class="comment-item"><b>${esc(c.visitor_name)}</b><p>${esc(c.body)}</p></div>`).join(''):'<p class="small">لا توجد تعليقات منشورة حتى الآن.</p>'}<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><form id="comment-form"><input type="hidden" name="issue_id" value="${esc(dialog.issueId)}"><input type="hidden" name="article_id" value="${esc(dialog.articleId)}"><div class="field"><label>اسم الزائرة *</label><input required maxlength="100" name="visitor_name"></div><div class="field"><label>التعليق *</label><textarea required maxlength="1200" name="body" placeholder="اكتبي تعليقكِ"></textarea></div><p class="help-text" style="margin-bottom:14px">لن يظهر تعليقك قبل موافقة رئيسة التحرير.</p><button class="btn btn-primary" type="submit">إرسال التعليق</button></form></div></div>`}

async function initBackend(){if(!cfg.supabaseUrl||!cfg.supabasePublishableKey)return;try{const mod=await import('https://esm.sh/@supabase/supabase-js@2.57.0');db=mod.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const {data:{user:existing}}=await db.auth.getUser();user=existing;await checkEditor();live=true;state={issues:[],submissions:[],comments:[],likes:[]};await refreshData();}catch(err){console.error('Supabase initialization',err);db=null;live=false;toast('تعذّر الاتصال بقاعدة البيانات؛ فُتحت النسخة التجريبية المحلية')}}
async function checkEditor(){isEditor=false;if(!user||!db)return;let {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error)console.warn('Admin check:',error.message);isEditor=Boolean(data)}
async function refreshData(){if(!live)return;const [i,c,l,s]=await Promise.all([db.from('mag_issues').select('*').order('created_at',{ascending:false}),db.from('mag_comments').select('*').order('created_at',{ascending:false}),db.from('mag_likes').select('issue_id,article_id,visitor_key'),isEditor?db.from('mag_submissions').select('*').order('created_at',{ascending:false}):Promise.resolve({data:[]})]);for(let r of [i,c,l,s])if(r.error)console.warn('Read:',r.error.message);state.issues=(i.data||[]).map(x=>({...x,articles:x.articles||[]}));state.comments=(c.data||[]);state.likes=(l.data||[]);if(isEditor){const vers=await db.from('mag_issue_versions').select('id,issue_id,captured_at,issue_snapshot').order('captured_at',{ascending:false}).limit(100);state.versions=vers.data||[]}else state.versions=[];state.submissions=await Promise.all((s.data||[]).map(async x=>{let signed=await Promise.all((x.photo_paths||[]).map(async p=>{const {data}=await db.storage.from('incoming').createSignedUrl(p,3600);return data?.signedUrl||''}));return {...x,photos:signed.filter(Boolean)}}));}
async function safeSaveIssue(issue){if(!live){persist();return true}const data={id:issue.id,title:issue.title,subtitle:issue.subtitle||'',cover_image:issue.cover_image||'',articles:issue.articles||[],status:issue.status,number:issue.number||null,published_at:issue.published_at||null};const {error}=await db.from('mag_issues').upsert(data,{onConflict:'id'});if(error){toast('تعذّر حفظ العدد: '+error.message);return false}await refreshData();return true}
async function safeUpdateSubmission(id,status){if(live){const {error}=await db.from('mag_submissions').update({status}).eq('id',id);if(error){toast('تعذّر تحديث المشاركة');return false}await refreshData()}else{let s=state.submissions.find(x=>x.id===id);if(s)s.status=status;persist()}return true}
async function safeUpdateComment(id,status){if(live){const {error}=await db.from('mag_comments').update({status}).eq('id',id);if(error){toast('تعذّر تحديث التعليق');return}await refreshData()}else{let c=state.comments.find(x=>x.id===id);if(c)c.status=status;persist()}render()}
async function safeDeleteIssue(id){if(live){const {error}=await db.from('mag_issues').delete().eq('id',id);if(error){toast('تعذّر حذف المسودة');return}await refreshData()}else{state.issues=state.issues.filter(x=>x.id!==id);persist()}render()}
async function imageAsDataURL(file){return new Promise((resolve,reject)=>{let im=new Image();let objectUrl=URL.createObjectURL(file);im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight,max=1200,scale=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.77))}catch(err){reject(err)}finally{URL.revokeObjectURL(objectUrl)}};im.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error('تعذرت قراءة الصورة'))};im.src=objectUrl})}
async function uploadImage(file,bucket='published-images'){if(!file)return '';if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)throw Error('نوع أو حجم الصورة غير مدعوم (الحد 10 ميجابايت)');if(!live)return imageAsDataURL(file);const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=`${uid()}.${ext}`;const {error}=await db.storage.from(bucket).upload(path,file,{contentType:file.type,upsert:false,cacheControl:'31536000'});if(error)throw error;return bucket==='incoming'?path:db.storage.from(bucket).getPublicUrl(path).data.publicUrl}
async function submissionImages(files){let paths=[];for(const file of files)paths.push(await uploadImage(file,live?'incoming':'published-images'));return paths}
async function publishSubmissionImages(sub){if(!live)return sub.photos||[];const paths=sub.photo_paths||[];const urls=[];for(const p of paths){const {data,error}=await db.storage.from('incoming').download(p);if(error)continue;let blob=new File([data],p.split('/').pop(),{type:data.type||'image/jpeg'});urls.push(await uploadImage(blob,'published-images'))}return urls}
async function createIssue(){const x={id:uid(),status:'draft',number:null,title:'مسودة عدد جديد',subtitle:'لكل إنجاز أثر',cover_image:ATHAR_MEDIA.m0,published_at:null,articles:[]};state.issues.unshift(x);if(!(await safeSaveIssue(x))){state.issues=state.issues.filter(i=>i.id!==x.id);return}editorIssueId=x.id;toast('أنشئت مسودة بلا رقم');render()}
async function publishIssue(id){let x=issueById(id);if(!x||x.status!=='draft')return;if(!x.articles?.length){toast('أضيفي موضوعًا واحدًا على الأقل قبل النشر');return}if(!confirm('هل تعتمدين هذا العدد وتنشرينه؟ سيُمنح الرقم التالي تلقائيًا.'))return;if(live){let {error}=await db.rpc('publish_mag_issue',{p_issue_id:id});if(error){toast('تعذّر نشر العدد: '+error.message);return}await refreshData()}else{x.number=Math.max(0,...state.issues.map(i=>i.number||0))+1;x.status='published';x.published_at=new Date().toISOString();persist()}toast('تم اعتماد العدد في '+(live?'الموقع':'المحاكاة المحلية'));render()}
async function addSubmissionToIssue(id){let s=state.submissions.find(x=>x.id===id);if(!s)return;let issue=drafts()[0];if(!issue){toast('أنشئي مسودة عدد قبل إضافة المشاركات');adminTab='issues';render();return}try{let imgs=await publishSubmissionImages(s);const a={id:uid(),title:s.headline,summary:s.kind,category:s.category||categories[0],importance:'medium',body:s.description,author:s.teacher,images:imgs};issue.articles.push(a);if(!(await safeSaveIssue(issue)))return;await safeUpdateSubmission(id,'accepted');editorIssueId=issue.id;editorId=a.id;adminTab='editor';toast('أُضيفت المشاركة إلى المسودة');render()}catch(e){toast('تعذّر معالجة الصور: '+e.message)}}
async function submitParticipation(form){let f=new FormData(form);const teacher=String(f.get('teacher')||'').trim(),headline=String(f.get('headline')||'').trim(),description=String(f.get('description')||'').trim();if(!teacher||!headline||!description)return toast('أكملي الحقول المطلوبة');if(!f.get('permission'))return toast('يرجى تأكيد مناسبة الصور للنشر');if(submitFiles.length>10)return toast('الحد الأعلى 10 صور');try{const imagePaths=await submissionImages(submitFiles);let s={id:uid(),teacher,headline,kind:String(f.get('kind')),category:String(f.get('category')),description,event_date:f.get('event_date')||null,status:'pending',created_at:new Date().toISOString()};if(live){let {error}=await db.from('mag_submissions').insert({...s,photo_paths:imagePaths});if(error)throw error}else{s.photos=imagePaths;state.submissions.unshift(s);persist()}submitFiles=[];uploadPreviews=[];toast('وصلت المشاركة للمراجعة، شكرًا لكِ');form.reset();updateUploadPreview()}catch(e){console.error(e);toast('تعذّر الإرسال: '+e.message)}}
async function saveArticle(form){let f=new FormData(form),i=issueById(f.get('issue_id'));if(!i)return;const aId=String(f.get('article_id')||''),old=i.articles.find(a=>a.id===aId);let images=old?.images?[...old.images]:[];try{for(let file of editFiles)images.push(await uploadImage(file));}catch(e){return toast('خطأ في رفع الصورة: '+e.message)}if(!live&&i.status==='published')snapshotLocal(i);let article={id:old?.id||uid(),title:String(f.get('title')).trim(),category:String(f.get('category')),importance:String(f.get('importance')),summary:String(f.get('summary')||'').trim(),body:String(f.get('body')).trim(),author:String(f.get('author')||'').trim(),images};if(!article.title||!article.body)return toast('يلزم العنوان ونص الموضوع');if(old)Object.assign(old,article);else i.articles.push(article);if(!(await safeSaveIssue(i)))return;editFiles=[];editorId=null;toast('حُفظ الموضوع');render()}
async function saveCover(form){let f=new FormData(form),i=issueById(String(f.get('issue_id')));if(!i)return;if(!live&&i.status==='published')snapshotLocal(i);i.title=String(f.get('title')||'').trim();i.subtitle=String(f.get('subtitle')||'').trim();const file=$('#cover-file')?.files?.[0];if(file)try{i.cover_image=await uploadImage(file)}catch(e){return toast('تعذّر رفع الغلاف: '+e.message)}if(!(await safeSaveIssue(i)))return;dialog=null;toast('حُفظ الغلاف');render()}
async function sendComment(form){let f=new FormData(form),visitor_name=String(f.get('visitor_name')||'').trim(),body=String(f.get('body')||'').trim(),issue_id=String(f.get('issue_id')),article_id=String(f.get('article_id'));if(!visitor_name||!body)return toast('الاسم والتعليق مطلوبان');let c={id:uid(),issue_id,article_id,visitor_name,body,status:'pending',created_at:new Date().toISOString()};if(live){let {error}=await db.from('mag_comments').insert(c);if(error)return toast('تعذّر إرسال التعليق: '+error.message)}else{state.comments.unshift(c);persist()}dialog=null;toast('وصل تعليقكِ للمراجعة، ولن يظهر حتى الاعتماد');render()}
async function toggleLike(issue_id,article_id){if(!issueById(issue_id)||!article_id)return;let old=state.likes.find(x=>x.issue_id===issue_id&&x.article_id===article_id&&x.visitor_key===visitorKey);if(live){if(old){toast('سُجل إعجابكِ بهذا الموضوع مسبقًا');return}let result=await db.from('mag_likes').insert({issue_id,article_id,visitor_key:visitorKey});if(result.error){toast('تعذّر تحديث الإعجاب');return}await refreshData()}else if(old){state.likes=state.likes.filter(x=>x!==old);persist()}else{state.likes.push({issue_id,article_id,visitor_key:visitorKey});persist()}render()}
function updateUploadPreview(){let el=$('#submit-thumbs');if(el)el.innerHTML=uploadPreviews.map(x=>htmlImg(x)).join('');let ed=$('#editor-thumbs');if(ed&&editFiles.length)ed.textContent=`${editFiles.length.toLocaleString('ar-SA')} صور مضافة`}
async function previewSubmitFiles(input){let files=[...input.files];if(files.length>10){toast('الحد الأعلى 10 صور');input.value='';return}if(files.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10*1024*1024)){toast('الصور يجب أن تكون JPG/PNG/WebP وأقل من 10 ميجابايت');input.value='';return}submitFiles=files;uploadPreviews=await Promise.all(files.slice(0,6).map(f=>imageAsDataURL(f)));updateUploadPreview()}
function readerMove(amount){
  if(!reader)return;
  let pages=pageList(issueById(reader.issueId));
  if(readerWide()){
    if(amount>0)reader.index=reader.index===0?1:Math.min(pages.length-1,reader.index+2);
    else reader.index=reader.index<=1?0:reader.index-2;
  }else reader.index=Math.max(0,Math.min(pages.length-1,reader.index+amount));
  render();
}
function snapshotLocal(x){state.versions??=[];state.versions.unshift({issue_id:x.id,captured_at:new Date().toISOString(),data:JSON.parse(JSON.stringify(x))});state.versions=state.versions.slice(0,30)}
document.addEventListener('click',async e=>{let el=e.target.closest('[data-action]');if(!el)return;const act=el.dataset.action,id=el.dataset.id;try{switch(act){
case 'nav':e.preventDefault();navigate(el.dataset.route||'home');break;
case 'toggle-menu':mobileOpen=!mobileOpen;render();break;
case 'admin-tab':adminTab=el.dataset.tab;editorId=null;render();break;
case 'open-reader':{let issue=issueById(id);if(!issue)return;reader={issueId:id,index:0};render();break}
case 'close-reader':reader=null;render();break;
case 'reader-next':readerMove(1);break;
case 'reader-prev':readerMove(-1);break;
case 'goto-page':if(reader){reader.index=Number(el.dataset.index);if(readerWide()&&reader.index>0&&reader.index%2===0)reader.index--;render()}break;
case 'like':await toggleLike(el.dataset.issue,el.dataset.article);break;
case 'comment-dialog':dialog={type:'comment',issueId:el.dataset.issue,articleId:el.dataset.article};render();break;
case 'close-dialog':dialog=null;render();break;
case 'lightbox':dialog={type:'image',src:el.dataset.src};render();break;
case 'create-issue':await createIssue();break;
case 'inbox-add':await addSubmissionToIssue(id);break;
case 'inbox-defer':await safeUpdateSubmission(id,'deferred');render();toast('حُفظت المشاركة لوقت لاحق');break;
case 'inbox-reject':if(confirm('هل تريدين استبعاد هذه المشاركة من قائمة العمل؟')){await safeUpdateSubmission(id,'rejected');render()}break;
case 'issue-config':dialog={type:'issue-config',id};render();break;
case 'issue-history':dialog={type:'history',id};render();break;
case 'restore-version':{let v=(state.versions||[]).find(v=>String(v.id)===String(id));let x=issueById(v?.issue_id);if(!v||!x)break;if(!confirm('استعادة هذه النسخة واستبدال محتوى العدد الحالي؟ سيُحفظ المحتوى الحالي كنسخة سابقة.'))break;if(!live)snapshotLocal(x);let snap=v.issue_snapshot;x.title=snap.title;x.subtitle=snap.subtitle;x.cover_image=snap.cover_image;x.articles=snap.articles;if(await safeSaveIssue(x)){dialog=null;toast('تمت استعادة محتوى النسخة السابقة');render()}break}
case 'issue-edit':editorIssueId=id;editorId=null;adminTab='editor';render();break;
case 'publish-issue':await publishIssue(id);break;
case 'delete-issue':if(confirm('حذف المسودة ومحتواها؟ لا يمكن التراجع عن هذا الإجراء.'))await safeDeleteIssue(id);break;
case 'edit-article':editorId=id;editFiles=[];render();window.scrollTo({top:160,behavior:'smooth'});break;
case 'editor-clear':editorId=null;editFiles=[];render();break;
case 'image-first':case 'image-remove':{const issue=issueById(el.dataset.issue),a=issue?.articles.find(v=>v.id===id),ix=Number(el.dataset.index);if(!a||!a.images?.[ix])break;if(!live&&issue.status==='published')snapshotLocal(issue);if(act==='image-first'){const [selected]=a.images.splice(ix,1);a.images.unshift(selected)}else a.images.splice(ix,1);await safeSaveIssue(issue);render();break}
case 'delete-article':{if(!confirm('إزالة الموضوع من هذا العدد؟'))break;let x=issueById(el.dataset.issue);if(x){if(!live&&x.status==='published')snapshotLocal(x);x.articles=x.articles.filter(a=>a.id!==id);if(await safeSaveIssue(x)){editorId=null;toast('أُزيل الموضوع');render()}}break}
case 'move-article':{let x=issueById(el.dataset.issue);if(x){let idx=x.articles.findIndex(a=>a.id===id),dest=idx+(el.dataset.dir==='up'?-1:1);if(dest>=0&&dest<x.articles.length){if(!live&&x.status==='published')snapshotLocal(x);[x.articles[idx],x.articles[dest]]=[x.articles[dest],x.articles[idx]];await safeSaveIssue(x);render()}}break}
case 'comment-approve':await safeUpdateComment(id,'approved');toast('نُشر التعليق');break;
case 'comment-reject':await safeUpdateComment(id,'rejected');toast('أُخفي التعليق');break;
case 'reset-demo':if(!live&&confirm('إعادة ضبط جميع بيانات التجربة المحلية؟')){state=seed();localStorage.removeItem('athar-magazine-v3');editorId=null;render();toast('أُعيد ضبط العرض التجريبي')}break;
case 'signout':if(live){await db.auth.signOut();user=null;isEditor=false;await refreshData();navigate('home')}break;
}}catch(err){console.error(err);toast('تعذّر إكمال العملية: '+err.message)}});
document.addEventListener('change',async e=>{if(e.target.id==='submission-photos')await previewSubmitFiles(e.target);if(e.target.id==='editor-photos'){let files=[...e.target.files];if(files.some(f=>f.size>10*1024*1024)||files.length>10){toast('حتى 10 صور، حجم الواحدة لا يزيد على 10 ميجابايت');return}editFiles=files;updateUploadPreview()}if(e.target.id==='active-draft'){editorIssueId=e.target.value||null;editorId=null;render()}});
document.addEventListener('submit',async e=>{let id=e.target.id;if(!['submission-form','article-form','issue-form','comment-form','login-form'].includes(id))return;e.preventDefault();let btn=e.target.querySelector('[type=submit]');if(btn)btn.disabled=true;try{if(id==='submission-form')await submitParticipation(e.target);if(id==='article-form')await saveArticle(e.target);if(id==='issue-form')await saveCover(e.target);if(id==='comment-form')await sendComment(e.target);if(id==='login-form'){if(!live||!db)return;let f=new FormData(e.target);let {data,error}=await db.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});if(error)throw error;user=data.user;await checkEditor();if(!isEditor){await db.auth.signOut();user=null;throw Error('هذا الحساب غير مخوّل لتحرير المجلة')}await refreshData();toast('مرحبًا بكِ في مكتب التحرير');render()}}catch(err){console.error(err);toast('لم تكتمل العملية: '+err.message)}finally{if(btn?.isConnected)btn.disabled=false}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(dialog||reader)){if(dialog)dialog=null;else reader=null;render()}else if(reader&&!dialog&&['ArrowRight','ArrowLeft'].includes(e.key)){readerMove(e.key==='ArrowLeft'?1:-1)}});
document.addEventListener('touchstart',e=>{if(!reader)return;const page=e.target.closest('#reading-page');if(page)readerTouchStart={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}},{passive:true});
document.addEventListener('touchend',e=>{if(!reader||!readerTouchStart)return;let dx=e.changedTouches[0].screenX-readerTouchStart.x,dy=e.changedTouches[0].screenY-readerTouchStart.y;readerTouchStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)readerMove(dx<0?1:-1)},{passive:true});
async function main(){render();await initBackend();render()}
main();
